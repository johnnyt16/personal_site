<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved theme choice before first paint so there is no flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Arm the scroll fade-ins only when motion is welcome, and disarm them
      // if the app hasn't taken over in 3s, so nothing can stay hidden.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var r = document.documentElement;
        r.classList.add('reveal');
        setTimeout(function () {
          if (!r.classList.contains('reveal-ready')) r.classList.remove('reveal');
        }, 3000);
      }
    </script>

    <!--head-->
    <title>Johnny McConkie</title>
    <!--/head-->

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
